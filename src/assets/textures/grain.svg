    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.18  0 0 0 0 0.08  0 0 0 0.22 -0.07"/>
  </filter>
  <rect width="320" height="320" filter="url(#g)"/>
</svg>
